<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Créer un compte — LibreAI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-halo h1"></div>
  <div class="bg-halo h2"></div>
  <div class="grain-grid"></div>

  <div class="auth-shell">
    <form class="auth-card glass" id="register-form" novalidate>
      <div class="auth-logo">
        <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="#0a0d13" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#0a0d13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span>LibreAI</span>
      </div>
      <h1>Créer votre compte</h1>
      <span class="subtitle">Rejoignez LibreAI en quelques secondes</span>

      <div id="alert-zone"></div>

      <div class="field">
        <label for="username">Nom d'utilisateur</label>
        <input type="text" id="username" name="username" autocomplete="nickname" placeholder="Votre nom" required minlength="2" maxlength="40">
      </div>
      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="new-password" placeholder="8 caractères minimum" required minlength="8">
      </div>
      <div class="field">
        <label for="confirm">Confirmer le mot de passe</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password" placeholder="••••••••" required minlength="8">
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Créer mon compte</button>

      <div class="auth-footer">Déjà inscrit ? <a href="/login.html">Se connecter</a></div>
    </form>
  </div>

  <script src="/js/background.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (async function checkExisting() {
      try {
        const { user } = await Api.get('/api/auth/me');
        if (user) window.location.href = '/index.html';
      } catch { /* pas connecté */ }
    })();

    const form = document.getElementById('register-form');
    const alertZone = document.getElementById('alert-zone');
    const submitBtn = document.getElementById('submit-btn');
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    function showError(msg) {
      alertZone.innerHTML = `<div class="alert alert-error">⚠️ ${msg}</div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertZone.innerHTML = '';
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm').value;

      if (username.length < 2) return showError("Le nom d'utilisateur est trop court.");
      if (!EMAIL_RE.test(email)) return showError('Adresse e-mail invalide.');
      if (password.length < 8) return showError('Le mot de passe doit contenir au moins 8 caractères.');
      if (password !== confirmPassword) return showError('Les mots de passe ne correspondent pas.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Création…';
      try {
        const data = await Api.post('/api/auth/register', { username, email, password, confirmPassword });
        window.location.href = `/verify.html?sent=1&email=${encodeURIComponent(data.email || email)}`;
      } catch (err) {
        showError(err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = 'Créer mon compte';
      }
    });
  </script>
</body>
</html>
