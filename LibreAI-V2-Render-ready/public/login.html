<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Connexion — LibreAI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-halo h1"></div>
  <div class="bg-halo h2"></div>
  <div class="grain-grid"></div>

  <div class="auth-shell">
    <form class="auth-card glass" id="login-form" novalidate>
      <div class="auth-logo">
        <div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="#0a0d13" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" stroke="#0a0d13" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
        <span>LibreAI</span>
      </div>
      <h1>Content de vous revoir</h1>
      <span class="subtitle">Connectez-vous pour continuer vos conversations</span>

      <div id="alert-zone"></div>
      <div id="resend-zone" style="display:none;margin-top:10px"><button type="button" class="btn btn-ghost btn-block" id="resend-btn">Renvoyer l’e-mail de confirmation</button></div>

      <div class="field">
        <label for="email">Adresse e-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" placeholder="vous@exemple.com" required>
      </div>
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" name="password" autocomplete="current-password" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="submit-btn">Se connecter</button>

      <div class="auth-footer">Pas encore de compte ? <a href="/register.html">Créer un compte</a></div>
    </form>
  </div>

  <script src="/js/background.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (async function checkExisting() {
      try {
        const { user } = await Api.get('/api/auth/me');
        if (user) window.location.href = '/index.html';
      } catch { /* pas connecté, on reste */ }
    })();

    const form = document.getElementById('login-form');
    const alertZone = document.getElementById('alert-zone');
    const submitBtn = document.getElementById('submit-btn');

    function showError(msg) {
      alertZone.innerHTML = `<div class="alert alert-error">⚠️ ${msg}</div>`;
    }

    document.getElementById('resend-btn')?.addEventListener('click', async () => {
      const email = document.getElementById('email').value.trim();
      if (!email) return showError('Saisissez votre adresse e-mail.');
      try {
        await Api.post('/api/auth/resend-verification', { email });
        alertZone.innerHTML = '<div class="alert alert-success">E-mail de confirmation renvoyé.</div>';
      } catch (err) { showError(err.message); }
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertZone.innerHTML = '';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      if (!email || !password) return showError('Veuillez remplir tous les champs.');

      submitBtn.disabled = true;
      submitBtn.textContent = 'Connexion…';
      try {
        await Api.post('/api/auth/login', { email, password });
        window.location.href = '/index.html';
      } catch (err) {
        showError(err.message);
        if (err.code === 'email_not_verified') document.getElementById('resend-zone').style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Se connecter';
      }
    });
  </script>
</body>
</html>
