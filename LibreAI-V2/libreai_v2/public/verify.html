<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Confirmation — LibreAI</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="bg-halo h1"></div><div class="bg-halo h2"></div><div class="grain-grid"></div>
  <div class="auth-shell">
    <div class="auth-card glass">
      <div class="auth-logo"><div class="logo-mark"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="#0a0d13" stroke-width="1.6"/><path d="M9 12l2 2 4-4" stroke="#0a0d13" stroke-width="1.6"/></svg></div><span>LibreAI</span></div>
      <h1 id="title">Confirmation e-mail</h1>
      <span class="subtitle" id="message">Vérification en cours…</span>
      <div id="actions" style="margin-top:20px"></div>
    </div>
  </div>
  <script src="/js/background.js"></script>
  <script src="/js/api.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const token = params.get('token');
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const actions = document.getElementById('actions');
      if (params.get('sent') === '1') {
        title.textContent = 'Vérifiez votre boîte mail 📧';
        message.textContent = `Un lien de confirmation a été envoyé à ${params.get('email') || 'votre adresse e-mail'}.`;
        actions.innerHTML = '<a class="btn btn-primary btn-block" href="/login.html">Aller à la connexion</a>';
        return;
      }
      if (!token) {
        title.textContent = 'Lien invalide';
        message.textContent = 'Aucun token de confirmation n’a été fourni.';
        actions.innerHTML = '<a class="btn btn-ghost btn-block" href="/login.html">Retour à la connexion</a>';
        return;
      }
      try {
        await Api.get('/api/auth/verify-email?token=' + encodeURIComponent(token));
        title.textContent = 'Adresse confirmée ✅';
        message.textContent = 'Votre compte LibreAI est maintenant activé.';
        actions.innerHTML = '<a class="btn btn-primary btn-block" href="/login.html">Se connecter</a>';
      } catch (err) {
        title.textContent = 'Confirmation impossible';
        message.textContent = err.message;
        actions.innerHTML = '<a class="btn btn-ghost btn-block" href="/login.html">Retour à la connexion</a>';
      }
    })();
  </script>
</body>
</html>
